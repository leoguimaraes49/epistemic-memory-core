[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epistemic-memory-core"
version = "0.5.7"
description = "Motor determinístico de memória estruturada, auditoria de premissas e verificação de evidências para agentes de IA via MCP."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Leonardo Guimarães (@leoguimaraes49)" }
]
dependencies = [
    "mcp==1.26.0",
    "numpy==2.4.6; python_version < '3.12'",
    "numpy==2.5.4; python_version >= '3.12'",
    "onnxruntime==1.31.1",
    "tokenizers==0.23.3",
]

[project.scripts]
emc = "cli:main"
emc-mcp = "ponte_pessoal:run_server"
emc-dashboard = "dashboard:main"
emc-verifier = "verificador_evidencias:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
    "apoio_decisao", "atribuicao", "autonomia", "autoteste", "avaliacoes",
    "cli", "conhecimento", "coordenador", "dashboard", "documentos",
    "esquemas", "evidencias", "execucao", "melhorias", "nucleo",
    "pesquisa", "ponte_pessoal", "provedores", "recuperacao",
    "recuperacao_fila", "revalidacao", "revisoes", "supervisor",
    "verificador_evidencias"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["testes*.py"]
